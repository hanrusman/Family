services:
  familiekalender:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///app/data/kalender.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is vereist}
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.familiekalender.rule=Host(`${KALENDER_HOST:-family.c4w.nl}`)"
      - "traefik.http.routers.familiekalender.entrypoints=web"
      - "traefik.http.services.familiekalender.loadbalancer.server.port=3000"
    networks:
      - traefik
    restart: unless-stopped

  familiekalender-whatsapp:
    build: ./whatsapp
    depends_on:
      - familiekalender
    volumes:
      - ./data/whatsapp-session:/app/session
    environment:
      - API_URL=http://familiekalender:3000
      - API_TOKEN=${API_TOKEN:?API_TOKEN is vereist}
    networks:
      - default
      - traefik
    restart: unless-stopped

networks:
  traefik:
    external: true
